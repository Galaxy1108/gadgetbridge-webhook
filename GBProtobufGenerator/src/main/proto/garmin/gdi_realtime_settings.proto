syntax = "proto2";

package garmin_vivomovehr;

option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";
option java_outer_classname = "GdiRealtimeSettings";

message RealtimeSettingsService {
    optional CompositionRequest definitionRequest = 1;
    optional CompositionResponse definitionResponse = 2;

    optional SettingsRequest stateRequest = 3;
    optional SettingsResponse stateResponse = 4;

    optional SettingsChangeRequest changeRequest = 5;
    optional SettingsChangeResponse changeResponse = 6;

    optional SettingsUpdatedNotification changeNotification = 7;

    optional StartUpDataRequest initRequest = 8;
    optional StartUpDataResponse initResponse = 9;

    optional MenuChangeRequest unk10 = 10;
    optional MenuChangeResponse unk11 = 11;

    optional SettingsStateRequest unk12 = 12;
    optional SettingsStateResponse unk13 = 13;
}

message MenuChangeRequest {
  optional uint32 unk1 = 1;
}

message MenuChangeResponse {
}

message SettingsStateRequest {
}

message SettingsStateResponse {
}

message CompositionRequest {
  optional uint32 screenId = 1;
  optional uint32 unk2 = 2; // 0
  optional string locale = 3; // en_US
}

message CompositionResponse {
  optional uint32 status = 1; // 0 = success, 2 = fail
  optional Composition definition = 2;
}

message Composition {
  optional uint32 screenId = 1;
  optional uint32 unk2 = 2; // 0
  optional uint32 unk3 = 3; // 928002
  optional FormattableString title = 4;
  repeated CompositionRow entry = 5;
  repeated MenuItem menu_entry = 6;
}

message FormattableString {
  optional string id = 1;
  optional string text = 2;
  repeated string unk3 = 3;
  repeated bytes unk4 = 4;
}

message CompositionRow {
  optional uint32 id = 1;
  optional RowType rowType = 2;
  optional FormattableString title = 3;
  optional uint32 unk4 = 4;
  optional Icon icon = 5;
  optional ScreenEntryMessage6 unk6 = 6;
  optional ScreenEntryMessage7 unk7 = 7;
  optional ScreenEntryMessage8 unk8 = 8;
  optional LinkOptions target = 9;
  optional ActionOptions action = 10;
  optional Icon iconRight = 11;
  optional ReorderListOptions sortOptions = 12;
  optional EditTextOptions textOption = 13;
  optional ScreenEntryMessage14 unk14 = 14;
  optional InformationMessage unk15 = 15; // info text if nothing can be set?
  optional Icon iconLeft = 17;
  optional ControlsMenuIconSetOptions unk18 = 18;
}

message ScreenEntryMessage6 {
  optional uint32 unk1 = 1;
  optional string unk2 = 2;
  optional uint32 unk3 = 3;
}

message ScreenEntryMessage7 {
}

message ScreenEntryMessage8 {
}

message ActionOptions {
  optional ConfirmationMessage unk1 = 1;
}

message ScreenEntryMessage14 {
  optional uint32 unk1 = 1;
  optional uint32 unk2 = 2;
  optional uint32 unk3 = 3;
  optional uint32 unk4 = 4;
}

message InformationMessage {
  optional FormattableString unk1 = 1;
  optional FormattableString unk2 = 2;
}

message ControlsMenuIconSetOptions {
  optional uint32 unk1 = 1;
  optional uint32 unk2 = 2;
}

message ReorderListOptions {
  optional uint32 unk3 = 3; // 1
  repeated ReorderListItem entries = 5;
}

message ReorderListItem {
  optional uint32 id = 1;
  optional FormattableString title = 2;
  optional uint32 unk5 = 5; // 1
  optional SortEntryMessage6 unk6 = 6;
}

message SortEntryMessage6 {
  optional uint32 unk1 = 1;
  optional uint32 unk2 = 2;
}

message EditTextOptions {
  enum KeyBoardType {
      ALPHANUMERIC = 0;
      INTEGER = 1;
      FLOAT = 2;
  }
  optional EditTextProperties limits = 1;
  optional KeyBoardType keyboard = 2;
  optional EditTextIntegerOptions integerLimits = 3;
}

message EditTextProperties {
  optional uint32 maxLength = 1;
}

message EditTextIntegerOptions {
    optional int32 minValue = 1;
    optional int32 maxValue = 2;
}

message EditTextDecimalOptions {
    optional float minValue = 1;
    optional float maxValue = 2;
    optional int32 precision = 3;
}

