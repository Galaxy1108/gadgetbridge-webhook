syntax = "proto2";

package garmin_vivomovehr;

option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";
option java_outer_classname = "GdiRealtimeSettings";

message RealtimeSettingsService {
    optional CompositionRequest composition_request = 1;
    optional CompositionResponse composition_response = 2;

    optional SettingsRequest settings_request = 3;
    optional SettingsResponse settings_response = 4;

    optional SettingsChangeRequest settings_change_request = 5;
    optional SettingsChangeResponse settings_change_response = 6;

    optional SettingsUpdatedNotification settings_updated_notification = 7;

    optional StartUpDataRequest start_up_data_request = 8;
    optional StartUpDataResponse start_up_data_response = 9;

    optional MenuChangeRequest menu_change_request = 10;
    optional MenuChangeResponse menu_change_response = 11;

    optional SettingsStateRequest settings_state_request = 12;
    optional SettingsStateResponse settings_state_response = 13;
}

message MenuChangeRequest {
  optional uint32 composition_id = 1;
}

message MenuChangeResponse {
}

message SettingsStateRequest {
}

message SettingsStateResponse {
}

message CompositionRequest {
  optional uint32 composition_id = 1;
  optional int32 depth = 2;
  optional string app_locale = 3; // en_US
}

message CompositionResponse {
  optional uint32 status = 1; // 0 = success, 2 = fail
  optional Composition compositions = 2;
}

message Composition {
  optional uint32 composition_id = 1;
  optional uint32 version = 2; // 0
  optional uint32 global_version = 3; // 928002
  optional FormattableString title = 4;
  repeated CompositionRow rows = 5;
  repeated MenuItem menu_items = 6;
}

message FormattableString {
  optional bytes handle = 1;
  optional string text = 2;
  repeated string format_args = 3;
  repeated bytes format_args_handles = 4;
}

message CompositionRow {
  optional uint32 row_id = 1;
  optional RowType type = 2;
  optional FormattableString title = 3;
  optional uint32 platform = 4;
  optional Icon icon = 5;
  optional TextOptions text_options = 6;
  optional SpacerOptions spacer_options = 7;
  optional ToggleOptions toggle_options = 8;
  optional LinkOptions link_options = 9;
  optional ActionOptions action_options = 10;
  optional Icon right_drawable = 11;
  optional ReorderListOptions reorder_list_options = 12;
  optional EditTextOptions edit_text_options = 13;
  optional DataScreenIconSetOptions data_screen_icon = 14;
  optional EmptyStateViewOptions empty_state_view_options = 15; // info text if nothing can be set
  optional Icon left_drawable = 17;
  optional ControlsMenuIconSetOptions controls_menu_icon = 18;
}

message TextOptions {
  optional uint32 style = 1;
  optional string redirect_url = 2;
  optional uint32 gravity = 3;
}

message SpacerOptions {
}

message ToggleOptions {
}

message ActionOptions {
  optional ConfirmationMessage confirmation = 1;
}

message DataScreenIconSetOptions {
  optional uint32 icon_set = 1;
  optional uint32 number_of_fields = 2;
  optional uint32 layout = 3;
  optional bool is_preview = 4;
}

message EmptyStateViewOptions {
  optional FormattableString description = 1;
  optional FormattableString action_text = 2;
}

message ControlsMenuIconSetOptions {
  optional uint32 icon_set = 1;
  optional uint32 control = 2;
}

message ReorderListOptions {
  optional uint32 action_type = 3; // 1
  repeated ReorderListItem list_items = 5;
}

message ReorderListItem {
  optional uint32 row_id = 1;
  optional FormattableString title = 2;
  optional bool action_enabled = 5;
  optional ControlsMenuIconSetOptions controls_menu_icon = 6;
}


message EditTextOptions {
  enum KeyBoardType {
      ALPHANUMERIC = 0;
      INTEGER = 1;
      FLOAT = 2;
  }
  optional EditTextProperties edit_text_properties = 1;
  optional KeyBoardType edit_text_type = 2;
  optional EditTextIntegerOptions edit_text_integer_options = 3;
}

message EditTextProperties {
  optional int32 maximum_code_point_length = 1;
}

message EditTextIntegerOptions {
    optional int32 minimum = 1;
    optional int32 maximum = 2;
}

message EditTextDecimalOptions {
    optional float minimum = 1;
    optional float maximum = 2;
    optional int32 precision = 3;
}

