  optional LinkType type = 1;
  optional uint32 subscreen = 2; // when 0
  optional ExternalLinkDestination activity = 3; // when 6
  optional SelectionOptions options = 4; // when 1
  optional TimePickerOptions durationOptions = 5;
  optional FloatPickerOptions floatOptions = 7;
  optional IntegerPickerOptions integerPicker = 8;
  optional CIQLinkOptions ciq = 11;
}

message TimePickerOptions {
  optional uint32 minSeconds = 1;
  optional uint32 maxSeconds = 2;
  optional uint32 stepSize = 3;
}

message FloatPickerOptions {
  optional float minValue = 1;
  optional float maxValue = 2;
  optional uint32 unk3 = 3;
  optional float stepSize = 4;
}

message CIQLinkOptions {
  optional int32 unk1 = 1;
  optional bytes store_app = 2;
  optional uint32 app_type = 5;
  optional uint32 unk6 = 6;
}

message SettingsRequest {
  optional uint32 screenId = 1;
}

message SelectionOptions {
  repeated SelectionItem option = 1;
  repeated MenuItem menu_entry = 2;
  optional uint32 unk3 = 3;
}

message SelectionItem {
  optional uint32 unk1 = 1;
  optional RowType rowType = 2;
  optional FormattableString title = 3;
  optional FormattableString subtitle = 4;
  optional Icon icon = 6;
  optional TargetOptionEntryMessage7 unk7 = 7;
}

message TargetOptionEntryMessage7 {
  optional uint32 unk1 = 1;
  optional uint32 unk2 = 2;
  optional uint32 unk3 = 3;
  optional uint32 unk4 = 4;
}

message IntegerPickerOptions {
  optional uint32 min = 1;
  optional uint32 max = 2;
  optional uint32 step = 3; // maybe? 1 on weight
}

message SettingsResponse {
  optional uint32 unk1 = 1; // 0
  optional Settings state = 2;
}

message Settings {
  optional uint32 screenId = 1;
  optional uint32 unk2 = 2; // 0
  optional uint32 unk3 = 3; // 928002
  repeated RowValue state = 4;
}

message RowValue {
  optional uint32 id = 1;
  optional uint32 state = 2;
  optional ToggleSettings switch = 3;
  optional DoubleLabelSettings summary = 4;
  optional AlertVolumeSettings alertSettings = 6;
  optional EntryStateMessage7 unk7 = 7;
  optional EntryStateMessage8 unk8 = 8;
  optional EntryStateMessage9 unk9 = 9;
}

message EntryStateMessage7 {
  optional FormattableString label1 = 1;
  optional FormattableString label2 = 2;
}

message EntryStateMessage8 {
  optional uint32 unk1 = 1;
}

message EntryStateMessage9 {
  optional FormattableString label1 = 1;
}

message AlertVolumeSettings {
  optional string dialect = 1;
}

message ToggleSettings {
  optional bool enabled = 1;
  optional FormattableString title = 2;
}

message DoubleLabelSettings {
  optional FormattableString title = 1;
  optional SelectionSettings valueList = 2;
  optional TimePickerSettings valueDuration = 3;
  optional TODPickerSettings valueTimeOfDay = 4;
  optional FloatPickerSettings valueFloat = 5;
  optional IntegerPickerSettings valueInteger = 6;
  optional DatePickerSettings valueDate = 8;
  optional HeightPickerSettings valueHeight = 10;
}

message SelectionSettings {
  optional uint32 index = 1;
}

message TODPickerSettings {
  optional uint32 seconds = 1;
  optional FormattableString formatted = 2;
  optional uint32 timeFormat = 3; // 0 12h, 1 24h
}

message TimePickerSettings {
  optional uint32 seconds = 1;
  optional FormattableString formatted = 2;
  optional FormattableString title = 3;
}

message FloatPickerSettings {
  optional float value = 1;
  optional FormattableString formatted = 2;
  optional FormattableString title = 3;
  optional FormattableString uom = 4;
}

message IntegerPickerSettings {
  optional uint32 value = 1;
  optional FormattableString formatted = 2;
  optional FormattableString title = 3;
  optional FormattableString unit = 4;
}

message DatePickerSettings {
  optional FormattableString subtitle = 1;
  optional Date currentDate = 2;
  optional Date minDate = 3;
  optional Date maxDate = 4;
}

message HeightPickerSettings {
  optional FormattableString subtitle = 1;
  optional uint32 value = 2;
  optional uint32 unit = 3; // 0 cm
}

message Date {
  optional uint32 month = 1;
  optional uint32 day = 2;
  optional uint32 year = 3;
}

message SettingsChangeRequest {
  optional uint32 screenId = 1;
  optional uint32 entryId = 2;
  optional ToggleChange switch = 3;
  optional SelectionChange option = 4;
  optional TimePickerChange duration = 5;
  optional TODPickerChange timeOfDay = 6;
  optional FloatPickerChange floatValue = 7;
  optional IntegerPickerChange integerValue = 8;
  optional ReorderableItemChange position = 11;
  optional DatePickerChange newDate = 12;
  optional EditTextValueChange text = 14;
  optional HeightPickerValueChange height = 15;
}

message ToggleChange {
  required bool value = 1;
}

message SelectionChange {
  optional uint32 index = 1;
}

message TimePickerChange {
  optional uint32 seconds = 1;
}

message TODPickerChange {
  optional uint32 seconds = 1;
}

message IntegerPickerChange {
  optional uint32 value = 1;
}

message ReorderableItemChange {
  optional uint32 index = 1;
  optional bool delete = 2;
}

message DatePickerChange {
  optional Date value = 1;
}

message EditTextValueChange {
  optional string value = 1;
}

message HeightPickerValueChange {
  optional uint32 value = 1;
  optional uint32 unit = 2;
}

message FloatPickerChange {
  optional float value = 1;
}

message SettingsChangeResponse {
  optional ResponseStatus status = 1;
  optional InformationMessageResponse unk2 = 2;
  optional Settings state = 3;
  optional bool unk4 = 4;
  optional bool shouldReturn = 5;
}

message InformationMessageResponse {
  optional FormattableString unk1 = 1;
  optional FormattableString unk2 = 2;
  optional FormattableString unk3 = 3;
}

message StartUpDataRequest {
  optional string language = 1; // en_US
  optional string region = 2; // us
}

message StartUpDataResponse {
  optional string part_number_1 = 1;
  optional string part_number_2 = 2;
  repeated uint32 unk3 = 3;
  optional uint32 unk4 = 4;
}

enum ResponseStatus {
  SUCCESS = 0;
  GENERIC_ERROR = 1;
}

message SettingsUpdatedNotification {
}

message ConfirmationMessage {
  optional FormattableString title = 1;
  optional FormattableString message = 2;
  optional FormattableString yes = 3;
  optional FormattableString no = 4;
  optional uint32 unk5 = 5;
  optional uint32 unk6 = 6;
}

message MenuItem {
  optional uint32 unk1 = 1;
  optional uint32 unk2 = 2;
  optional FormattableString label = 3;
  optional uint32 unk4 = 4;
  optional LinkOptions target = 5;
  optional uint32 unk6 = 6;
  optional uint32 unk7 = 7;
  optional ConfirmationMessage menu_message = 9;
}

