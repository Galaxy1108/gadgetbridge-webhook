  optional LinkType link_type = 1;
  optional uint32 dest_composition_id = 2;
  optional ExternalLinkDestination dest_page = 3;
  optional SelectionOptions selection_options = 4;
  optional TimePickerOptions time_picker_options = 5;
  optional FloatPickerOptions float_picker_options = 7;
  optional IntegerPickerOptions integer_picker_options = 8;
  optional CIQLinkOptions ciq_link_options = 11;
}

message TimePickerOptions {
  optional uint32 min_time_seconds = 1;
  optional uint32 max_time_seconds = 2;
  optional uint32 granularity_seconds = 3;
}

message FloatPickerOptions {
  optional float minimum = 1;
  optional float maximum = 2;
  optional uint32 precision = 3;
  optional float granularity = 4;
}

message CIQLinkOptions {
  optional int32 device_id = 1;
  optional bytes store_app_id = 2;
  optional uint32 app_type = 5;
  optional uint32 destination = 6;
}

message SettingsRequest {
  optional uint32 composition_id = 1;
}

message SelectionOptions {
  repeated SelectionItem rows = 1;
  repeated MenuItem menu_items = 2;
  optional bool exit_items_on_tap = 3;
}

message SelectionItem {
  optional uint32 row_id = 1;
  optional RowType type = 2;
  optional FormattableString title = 3;
  optional FormattableString subtext = 4;
  optional Icon icon = 6;
  optional DataScreenIconSetOptions data_screen_icon = 7;
}


message IntegerPickerOptions {
  optional int32 minimum = 1;
  optional int32 maximum = 2;
  optional int32 granularity = 3;
}

message SettingsResponse {
  optional uint32 status = 1;
  optional Settings settings = 2;
}

message Settings {
  optional uint32 composition_id = 1;
  optional uint32 composition_version = 2;
  optional uint32 global_version = 3;
  repeated RowValue rows = 4;
}

message RowValue {
  optional uint32 row_id = 1;
  optional uint32 view_state = 2;
  optional ToggleSettings toggle_settings = 3;
  optional DoubleLabelSettings double_label_settings = 4;
  optional AlertVolumeSettings alert_volume_settings = 6;
  optional EditTextSettings edit_text_settings = 7;
  optional SelectionSettings single_label_selection_settings = 8;
  optional ActionSettings action_view_settings = 9;
}

message EditTextSettings {
  optional FormattableString formatted_value = 1;
  optional FormattableString edit_text_value = 2;
}


message ActionSettings {
  optional FormattableString subtext = 1;
}

message AlertVolumeSettings {
  required string alert_dialect = 1;
}

message ToggleSettings {
  optional bool toggle_value = 1;
  optional FormattableString subtext = 2;
}

message DoubleLabelSettings {
  optional FormattableString subtext = 1;
  optional SelectionSettings selection_settings = 2;
  optional TimePickerSettings time_picker_settings = 3;
  optional TODPickerSettings tod_picker_settings = 4;
  optional FloatPickerSettings float_picker_settings = 5;
  optional IntegerPickerSettings integer_picker_settings = 6;
  optional DatePickerSettings date_picker_settings = 8;
  optional HeightPickerSettings height_picker_settings = 10;
}

message SelectionSettings {
  optional uint32 selected_index = 1;
}

message TODPickerSettings {
  optional uint32 seconds = 1;
  optional FormattableString formatted_value = 2;
  optional uint32 time_format = 3; // 0 12h, 1 24h
}

message TimePickerSettings {
  optional uint32 seconds = 1;
  optional FormattableString formatted_value = 2;
  optional FormattableString picker_title = 3;
}

message FloatPickerSettings {
  optional float float_value = 1;
  optional FormattableString formatted_value = 2;
  optional FormattableString picker_title = 3;
  optional FormattableString measurement_unit = 4;
}

message IntegerPickerSettings {
  optional int32 integer_value = 1;
  optional FormattableString formatted_value = 2;
  optional FormattableString picker_title = 3;
  optional FormattableString measurement_unit = 4;
}

message DatePickerSettings {
  optional FormattableString formatted_value = 1;
  optional Date selected_date = 2;
  optional Date minimum_date = 3;
  optional Date maximum_date = 4;
}

message HeightPickerSettings {
  optional FormattableString formatted_value = 1;
  optional uint32 height_value = 2;
  optional uint32 measurement_unit = 3;
}

message Date {
  optional uint32 month = 1;
  optional uint32 day = 2;
  optional uint32 year = 3;
}

message SettingsChangeRequest {
  optional uint32 composition_id = 1;
  optional uint32 row_id = 2;
  optional ToggleChange toggle_change = 3;
  optional SelectionChange selection_change = 4;
  optional TimePickerChange time_picker_change = 5;
  optional TODPickerChange tod_picker_change = 6;
  optional FloatPickerChange float_picker_change = 7;
  optional IntegerPickerChange integer_picker_change = 8;
  optional ReorderableItemChange reorderable_item_change = 11;
  optional DatePickerChange date_picker_change = 12;
  optional EditTextValueChange edit_text_value_change = 14;
  optional HeightPickerValueChange height_picker_value_change = 15;
}

message ToggleChange {
  required bool new_toggle_value = 1;
}

message SelectionChange {
  optional uint32 new_selected_index = 1;
}

message TimePickerChange {
  optional uint32 new_seconds = 1;
}

message TODPickerChange {
  optional uint32 new_seconds = 1;
}

message IntegerPickerChange {
  optional int32 new_integer_value = 1;
}

message ReorderableItemChange {
  optional uint32 new_list_position = 1;
  optional bool is_delete = 2;
}

message DatePickerChange {
  optional Date new_date = 1;
}

message EditTextValueChange {
  optional string new_edit_text_value = 1;
}

message HeightPickerValueChange {
  optional uint32 height_value = 1;
  optional uint32 measurement_unit = 2;
}

message FloatPickerChange {
  optional float new_float_value = 1;
}

message SettingsChangeResponse {
  optional ResponseStatus status = 1;
  optional InformationMessage information_message = 2;
  optional Settings updated_settings = 3;
  optional bool is_invalidate = 4;
  optional bool is_exit_instance = 5;
}

message InformationMessage {
  optional FormattableString title = 1;
  optional FormattableString message = 2;
  optional FormattableString neutral_text = 3;
}

message StartUpDataRequest {
  optional string app_locale = 1; // en_US
  optional string app_consent_country = 2; // us
}

message StartUpDataResponse {
  optional string app_locale_language_part_number = 1;
  optional string device_locale_language_part_number = 2;
  repeated uint32 icon_sets = 3;
  optional uint32 communicate_type = 4;
}

enum ResponseStatus {
  SUCCESS = 0;
  FAIL = 1;
}

message SettingsUpdatedNotification {
}

message ConfirmationMessage {
  optional FormattableString title = 1;
  optional FormattableString message = 2;
  optional FormattableString positive_text = 3;
  optional FormattableString negative_text = 4;
  optional bool destructive_positive_action = 5;
  optional bool destructive_negative_action = 6;
}

message MenuItem {
  optional uint32 type = 1;
  optional uint32 show_on_bar = 2;
  optional FormattableString title = 3;
  optional uint32 menu_id = 4;
  optional LinkOptions link_options = 5;
  optional uint32 destructive_action = 6;
  optional uint32 item_position = 7;
  optional ConfirmationMessage confirmation_message = 9;
}

