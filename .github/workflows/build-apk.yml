name: Build APK

# 手动触发打包：默认构建 webhook-module 分支的 Debug APK（双 flavor）。
# 产物在 Actions 运行页的 Artifacts 里下载。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支'
        type: string
        default: webhook-module
      variant:
        description: '构建变体（Debug 可直接安装；Nightly 为混淆精简版，同样用 debug 签名）'
        type: choice
        options:
          - Debug
          - Nightly
          - Nopebble
        default: Debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ inputs.variant }} APKs
        run: ./gradlew :app:assemble${{ inputs.variant }} --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.variant }}-${{ inputs.branch }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
