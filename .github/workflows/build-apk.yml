name: Build APK

# 手动触发打包：默认构建 webhook-module 分支的 Debug APK（仅 mainline flavor，
# banglejs flavor 只给 Bangle.js 手表用，本项目不需要）。
# 产物在 Actions 运行页的 Artifacts 里下载。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支'
        type: string
        default: webhook-module
      variant:
        description: '构建变体（Debug 可直接安装；Nightly 为混淆精简版，同样用 debug 签名）'
        type: choice
        options:
          - Debug
          - Nightly
          - Nopebble
        default: Debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-24.04 runner 镜像的 sdkmanager 不在 PATH 上，
      # 这里自包含安装 cmdline-tools（与本地验证过的版本一致）。
      - name: Install Android cmdline-tools
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools"
          curl -sL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$RUNNER_TEMP/android-sdk/cmdline-tools"
          mv "$RUNNER_TEMP/android-sdk/cmdline-tools/cmdline-tools" \
             "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept licenses and install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ inputs.variant }} APK (mainline)
        run: ./gradlew :app:assembleMainline${{ inputs.variant }} --stacktrace

      - name: Rename APK with branch and commit info
        run: |
          mkdir -p apk-dist
          SHORT_SHA="${GITHUB_SHA:0:7}"
          VARIANT_LOWER=$(echo '${{ inputs.variant }}' | tr 'A-Z' 'a-z')
          find app/build/outputs/apk/mainline -name "*.apk" -exec \
            cp {} "apk-dist/gadgetbridge-webhook-${VARIANT_LOWER}-${{ inputs.branch }}-${SHORT_SHA}.apk" \;
          ls -la apk-dist/

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: apk-${{ inputs.variant }}-${{ inputs.branch }}
          path: apk-dist/*.apk
          if-no-files-found: error
